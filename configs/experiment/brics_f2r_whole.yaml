# @package _global_
defaults:
  - override /model: brics_f2r_whole
  - override /data: brics_f2r_whole
  - override /task: brics_f2r_whole
  - override /callbacks: brics_fsq
  - override /trainer: fragment_default

run:
  name_prefix: brics-f2r-whole

chem_supervision:
  enabled: false
group_supervision:
  enabled: false
forward_capture:
  enabled: false
coati_validation:
  enabled: false

callbacks:
  best_checkpoint:
    monitor: val/fused_pooled_ap
    filename: "epoch={epoch:02d}-ap={val/fused_pooled_ap:.4f}"
