seed: 42
lr: 1.0e-4
weight_decay: 1.0e-2

logging:
  save_dir: .
  run_name_prefix: concisejepa

forward_capture:
  enabled: true
  stage: train
  batch_idx: 0
  filename: train_forward_logits_last.json
  output_path: ""

checkpoint:
  dir: checkpoints
  filename: "{epoch:02d}-{val_dti_auprc:.4f}"
  monitor: val/dti_auprc
  mode: max
  save_top_k: 1
  save_last: true

trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 20
  enable_progress_bar: true

coati_validation:
  enabled: true
  device: cuda:0
  doc_url: s3://terray-public/models/grande_closed.pkl
  noise_scale: 0.0
  max_decode_batches_per_epoch: 1
  table_max_rows: 64

synthetic_validation:
  enabled: false
  seed: 17
  decode_batch_size: 256
  morgan_radius: 2
  morgan_n_bits: 2048
  umap_n_neighbors: 30
  umap_min_dist: 0.15
  morgan_umap_metric: jaccard
  coati_umap_metric: euclidean
  point_size: 26.0
  point_alpha: 0.9
  max_decode: 1000

model:
  _target_: concisejepa.models.concise_jepa.ConciseJEPA
  concise_backbone:
    _target_: concisejepa.models.concise.Concise
    drug_layers:
      - [32, 32, 32]
    ligand_dim: 2048
    residue_dim: 1280
    drug_dim: 128
    proj_dim: 256
    nheads: 32
    activation: tanh
    cosine_prediction: false
  smiles_target_dim: 256
  jepa_hidden_dim: 512

datamodule:
  _target_: concisejepa.datamodules.BindingDBDictDataModule
  train_csv: /hpc/group/singhlab/user/me196/projects/moleculerep/runs/REVICE/data/bindingdb/train.csv
  val_csv: /hpc/group/singhlab/user/me196/projects/moleculerep/runs/REVICE/data/bindingdb/val.csv
  test_csv: /hpc/group/singhlab/user/me196/projects/moleculerep/runs/REVICE/data/bindingdb/test.csv
  # Save generated embeddings to this shared path.
  protein_embeddings_path: /hpc/group/singhlab/user/cy244/projects/peptides/raygun_embeddings.pt
  morgan_embeddings_path: /hpc/group/singhlab/user/cy244/projects/peptides/morgan_embeddings.pt
  smiles_embeddings_path: /hpc/group/singhlab/user/cy244/projects/peptides/coati_embeddings.pt
  embedding_device: cuda:0
  coati_doc_url: s3://terray-public/models/grande_closed.pkl
  sequence_col: Target Sequence
  smiles_col: SMILES
  label_col: Label
  batch_size: 1028
  num_workers: 4
  pin_memory: true
  persistent_workers: true
