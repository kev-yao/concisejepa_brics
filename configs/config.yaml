defaults:
  - model: wholemol_fsq
  - data: bindingdb
  - task: dti_jepa
  - callbacks: wholemol_fsq
  - trainer: default
  - logger: csv
  - _self_
  - experiment: null

seed: 42
lr: 1.0e-4
weight_decay: 1.0e-2

run:
  name_prefix: concisejepa
  output_root: ${oc.env:CONCISEJEPA_RUN_ROOT,outputs}

# Populated by main.py before interpolated components are instantiated.
runtime:
  run_id: null
  run_name: null
  run_dir: null
  checkpoint_dir: null

# Disable for candidate fits; evaluate the locked winner separately.
evaluation:
  run_test: true

negative_diagonal_loss:
  enabled: true
  weight: 1.0
  margin: 0.0

forward_capture:
  enabled: true
  stage: train
  batch_idx: 0
  filename: train_forward_logits_last.json
  output_path: ""

coati_validation:
  enabled: true
  device: cuda:0
  doc_url: s3://terray-public/models/grande_closed.pkl
  noise_scale: 0.0
  max_decode_batches_per_epoch: 1
  table_max_rows: 64

chem_supervision:
  enabled: true
  weight: 0.1
  post_fsq: true

group_supervision:
  enabled: true
  weight: 0.1

synthetic_validation:
  enabled: false
  seed: 17
  decode_batch_size: 256
  morgan_radius: 2
  morgan_n_bits: 2048
  umap_n_neighbors: 30
  umap_min_dist: 0.15
  morgan_umap_metric: jaccard
  coati_umap_metric: euclidean
  point_size: 26.0
  point_alpha: 0.9
  max_decode: 1000

hydra:
  job:
    chdir: false
