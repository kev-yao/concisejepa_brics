defaults:
  - brics_f2r_whole
  - _self_

_target_: concisejepa.models.set_binding.ConciseJEPASetBinding
concise_fragment:
  _target_: concisejepa.models.set_binding.ConciseFragmentSetReadout
  drug_quantizer:
    type: fsq
  # Four typed live pair features; NOT a replacement for F2R pooling.
  set_head:
    model_dim: 128
    num_heads: 4
    num_blocks: 2
    dropout: 0.2
    ff_multiplier: 2
whole_binding_weight: 0.05
